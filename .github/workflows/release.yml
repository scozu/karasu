name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install extension dependencies
        working-directory: platforms/vscode
        run: bun install --frozen-lockfile

      - name: Generate themes
        run: node scripts/build-themes.mjs

      - name: Run consistency checks
        run: node scripts/check-consistency.mjs

      - name: Run VS Code theme checks
        run: node scripts/check-vscode-theme.mjs

      - name: Package VSIX
        working-directory: platforms/vscode
        run: bun run package

      - name: Publish to Open VSX
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          packagePath: platforms/vscode/*.vsix

      - name: Publish to VS Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          packagePath: platforms/vscode/*.vsix
