name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  vscode-extension:
    name: Build and Validate VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install extension dependencies
        working-directory: platforms/vscode
        run: bun install --frozen-lockfile

      - name: Generate themes
        run: node scripts/build-themes.mjs

      - name: Run consistency checks
        run: node scripts/check-consistency.mjs

      - name: Run VS Code theme checks
        run: node scripts/check-vscode-theme.mjs

      - name: Package VSIX
        working-directory: platforms/vscode
        run: bun run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: karasu-theme-vsix
          path: platforms/vscode/*.vsix
